{% load static %}

  <section class="hero">
    <!-- Fundo de vídeo -->
    <video class="hero__bg" autoplay loop muted playsinline aria-label="Vídeo de Nobres">
      <source src="{% static 'medias/video.mp4' %}" type="video/mp4">
    </video>

    <div class="container hero__inner">
      <p class="eyebrow eyebrow--light">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 14.5s5-4.3 5-8a5 5 0 1 0-10 0c0 3.700 5 8 5 8Z"/><circle cx="8" cy="6.500" r="1.800"/></svg>
        NOBRES, MATO GROSSO
      </p>

      <div class="hero__content">
        <h1>O extraordinário<br>é natural.</h1>
        <p class="hero__text">Águas que surpreendem. Caminhos que conectam.<br>Descubra Nobres com a Nobre Turismo.</p>
        <a href="#contato" class="btn btn--mint">
          Quero viver essa experiência
          <svg class="btn__arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 12 4M5.5 4H12v6.5"/></svg>
        </a>
      </div>

      <div class="hero__footer">

        <a href="#experiencias" class="scroll-hint">
          A natureza te espera
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3.500 8.500 8 13l4.500-4.500"/></svg>
        </a>
      </div>
    </div>
  </section>
